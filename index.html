<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0B0A">
<meta name="robots" content="noindex, nofollow">
<title>The Baddie Files – Confidential</title>
<meta name="description" content="Confidential. Birthday prowl, one pack.">
<meta property="og:title" content="The Baddie Files">
<meta property="og:description" content="Confidential. Not everyone is made for the wild.">
<meta property="og:image" content="assets/emblem.webp">
<link rel="icon" href="assets/emblem.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="leo-bg" aria-hidden="true"></div>

<main class="cover">
  <div class="cover__frame">
    <img class="cover__emblem" src="assets/emblem.webp" alt="Glowing gold clawed paw in a burgundy and gold fire ring" width="124" height="124">

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div class="script" style="font-size:46px;line-height:1">Confidential</div>
      <h1 class="cover__title">THE BADDIE FILES</h1>
      <div class="slash" style="width:210px"></div>
      <div class="caps cover__sub">BIRTHDAY PROWL<br>ONE PACK</div>
    </div>

    <p class="cover__tag">Not everyone is made for the wild.</p>

    <div class="cover__bottom">
      <form id="gate" class="cover__form" novalidate>
        <label for="pw">ENTER THE PASSCODE</label>
        <input id="pw" class="field" type="password" placeholder="Passcode" autocomplete="off" autocapitalize="characters" enterkeyhint="go" required>
        <p id="pw-error" class="cover__error" role="alert" hidden>Wrong passcode. Teaser 2 spells it out.</p>
        <button type="submit" class="btn" style="min-height:54px">UNLOCK</button>
      </form>

      <div id="unlocked" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px" hidden>
        <p class="script" style="margin:0;font-size:30px">Untamed &amp; unlocked</p>
        <a class="btn" href="invite.html" style="min-height:54px">OPEN YOUR INVITATION</a>
      </div>

      <div class="motto">STAY CURIOUS. STAY FIERCE.</div>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/cover.js"></script>
</body>
</html>
